# Standalone staticcheck (honnef.co/go/tools, 2024.1.1 for Go 1.23). Mirrors go/.golangci.yml.
# ST1005 (lower-case error strings) is off: the port's error texts reproduce Node's thrown
# messages verbatim ("Command failed: git ...", "Connection error: ...", V8 TypeErrors), and they
# reach update.json, the debug log and Claude Code.
checks = ["inherit", "-ST1005"]
