[package]
name = "jev-router"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Rust implementation of jev-claude. The release version lives in the root package.json."
license = "MIT"
publish = false

[lib]
name = "jev_router"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal", "process"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
sha1 = "0.10"
regex = "1"

[profile.release]
opt-level = 3

