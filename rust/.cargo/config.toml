# Applies to every cargo command run inside rust/.
[build]
# `cargo doc` fails on any rustdoc warning (broken intra-doc links, bad code blocks), so the
# documentation gate is the same command on every shell and in CI.
rustdocflags = ["-D", "warnings"]

# The release programs are copied to machines without Visual Studio, so link the C runtime into
# them: a dynamic build needs the Visual C++ Redistributable (vcruntime140.dll) and fails to start
# without it.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
