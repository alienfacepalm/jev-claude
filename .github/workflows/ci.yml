# Checks every implementation on every push and pull request: one job per language, each on
# Windows (the gating platform, SPEC.md 16) and Ubuntu. Each job runs that implementation's lint,
# format and unit-test gates, then the black-box conformance harness against its own programs.
# The commands are the ones in doc/NODE.md, doc/GO.md, doc/RUST.md and doc/PYTHON.md; change them
# there and here together. Releases are cut separately by version-bump.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The golden cases are generated by Node 24.21.x and the generator refuses any other version, so
  # the harness legs pin it too. Move this, SPEC.md 16.2 and conformance/generate.mjs together.
  REFERENCE_NODE: "24.21"

jobs:
  node:
    name: node (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["24.21"]
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm run format:check

      - name: Unit tests and conformance harness against Node
        run: pnpm test

      # The committed golden cases must be exactly what the Node code generates today.
      - name: Golden cases match the code
        if: matrix.node == env.REFERENCE_NODE
        run: |
          node conformance/generate.mjs
          git diff --exit-code conformance/cases
          untracked="$(git status --porcelain conformance/cases)"
          if [ -n "$untracked" ]; then echo "$untracked"; exit 1; fi

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Build the lint tools with the Go 1.23 installed below instead of downloading a newer Go;
      # golangci-lint v2.1.6 cannot load packages under a newer toolchain (doc/GO.md).
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # Node and the root dependencies first: the unit tests run node, and the harness needs both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.REFERENCE_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # The module is standard library only, so there is no go.sum to key a cache on.
          cache: false

      - name: Install the pinned lint tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: staticcheck
        working-directory: go
        run: staticcheck ./...

      - name: golangci-lint
        working-directory: go
        run: golangci-lint run ./...

      - name: Unit and golden tests
        working-directory: go
        run: go test ./...

      # The race detector needs cgo and a C compiler, which the Ubuntu runner has.
      - name: Race detector
        if: runner.os == 'Linux'
        working-directory: go
        run: go test -race ./...

      - name: Build
        working-directory: go
        run: go build -o bin/ ./cmd/...

      # The harness checks that the program file exists, so Windows needs the .exe suffix.
      - name: Conformance harness against Go
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          JEV_IMPL_CMD_PROXY="go/bin/jev-proxy-host$exe" \
          JEV_IMPL_CMD_STATUSLINE="go/bin/jev-statusline$exe" \
          node --test conformance/harness

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
        # rust/.cargo/config.toml (rustdoc warnings are errors) is read only from inside rust/.
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # Node and the root dependencies first: the unit tests run node, and the harness needs both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.REFERENCE_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # The MSRV first, then stable, so stable ends up as the default toolchain.
      - uses: dtolnay/rust-toolchain@1.85

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Make stable the default explicitly; the MSRV check below names +1.85.
      - run: rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit, integration and golden tests
        run: cargo test --locked

      - name: rustdoc
        run: cargo doc --no-deps --locked

      - name: MSRV (1.85) still builds
        run: cargo +1.85 check --all-targets --locked

      - name: Release build
        run: cargo build --release --locked

      # The harness checks that the program file exists, so Windows needs the .exe suffix.
      - name: Conformance harness against Rust
        working-directory: .
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          JEV_IMPL_CMD_PROXY="rust/target/release/jev-proxy-host$exe" \
          JEV_IMPL_CMD_STATUSLINE="rust/target/release/jev-statusline$exe" \
          node --test conformance/harness

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Node and the root dependencies first: the unit tests run node, and the harness needs both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.REFERENCE_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runtime is standard library only; ruff and mypy come from the pinned "dev" extra.
      # The editable install keeps the package in the clone, so the repository root is found.
      - name: Virtual environment with the dev tools
        run: |
          python -m venv python/.venv
          if [ "$RUNNER_OS" = "Windows" ]; then py="python/.venv/Scripts/python.exe"; else py="python/.venv/bin/python"; fi
          echo "PY=$py" >> "$GITHUB_ENV"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -e "./python[dev]"

      - name: ruff format
        run: '"$PY" -m ruff format --check python'

      - name: ruff check
        run: '"$PY" -m ruff check python'

      - name: mypy (win32)
        run: '"$PY" -m mypy --config-file python/pyproject.toml --platform win32'

      - name: mypy (linux)
        run: '"$PY" -m mypy --config-file python/pyproject.toml --platform linux'

      - name: compileall
        run: '"$PY" -m compileall -q python/src'

      - name: Unit and golden tests
        run: '"$PY" -m unittest discover -s python/tests -t python'

      # The harness spawns the command without a shell, so it must name the real interpreter (the
      # venv's), never a shim. A relative path is made absolute against the repository root.
      - name: Conformance harness against Python
        run: |
          JEV_IMPL_CMD_PROXY="$PY -m jev_router.cli.proxy_host" \
          JEV_IMPL_CMD_STATUSLINE="$PY -m jev_router.cli.statusline" \
          node --test conformance/harness
