# Checks the Rust edition (the only edition there is) on every push and pull request. Windows is
# the gating platform (SPEC.md 16), so every job that builds or runs a program covers Windows,
# Ubuntu and macOS:
#   lint              shellcheck (install.sh, .github/scripts) and actionlint (this
#                     file and .github/actions, with shellcheck on every run: block)
#   rust              fmt, clippy, tests (unit, golden, black-box conformance, xtask), doc, MSRV,
#                     release build, static C runtime on Windows (windows, ubuntu, macos); and the
#                     node-gated launcher tests both with node (required) and without it
#   release-targets   every published target (musl Linux x64/arm64, Windows x64, macOS arm64 and
#                     Intel) built, checked for static linking, packaged and installed by the real
#                     installer, from this commit, before any release is tagged
#   installers        install.sh / install.ps1 against the freshly built binaries
#                     (`cargo xtask installer-smoke-test`; windows, ubuntu, macos, and Windows on
#                     ARM through x64 emulation), plus the skills' command lines under PowerShell
#   installer-alpine  install.sh on Alpine: musl libc, BusyBox tar and sha256sum, wget, no git
# The repository holds no Python and no JavaScript: the developer and release tooling is the
# cargo xtask crate (rust/xtask), the conformance harness is Rust integration tests, and the
# programs read their version from the root package.json at run time (SPEC.md 2.3). Node.js is
# installed in the rust job only because a few launcher tests deliberately start an npm-style
# fake `claude` through `node`. Those tests skip, printing a note, when `node` is absent, so CI
# requires node for them (JEV_REQUIRE_NODE=1, and a skip note fails the step): removing
# setup-node fails the build instead of silently dropping them. A separate step runs them with
# node taken off PATH, which is the only run of their no-node branches.
# The commands are the ones in doc/RUST.md; change them there and here together.
# The last jobs cut the release (version bump, tag, native archives, GitHub release) and only run
# when every job above passed. If a binaries leg fails after the tag exists, "Re-run failed jobs"
# on the run rebuilds just that leg and then publishes; the release job is not repeated.
name: CI

on:
  push:
    # Branches only: a tag pushed by hand or with a personal token must not start the full matrix.
    # (Tags pushed by the release job with GITHUB_TOKEN never start a run anyway.)
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress, except on master:
# a master run is never cancelled mid-run, so a release is never cut half way. A pending master run
# can still be replaced by a newer one, which is harmless: the version bump counts every commit
# since the last release tag (`cargo xtask bump-version`), so the newer run releases those commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  # Only the rust job's node-gated launcher tests use Node.js (see the header); no version is
  # enforced anywhere, so the current LTS line is enough.
  NODE_VERSION: "24"

jobs:
  # Static checks of everything that is not Rust: the installers' shell, the CI scripts,
  # and the workflow itself. install.ps1 is not parsed here: the Windows installer legs run it
  # under both Windows PowerShell 5.1 and PowerShell 7, which finds a syntax error either way.
  lint:
    name: lint (shell, workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on the Ubuntu runners; each file's shebang picks the dialect
      # (install.sh is bash).
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S style install.sh .github/scripts/*.sh

      # Pinned; the image carries its own shellcheck, which actionlint runs on every run: block.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
        # rust/.cargo/config.toml (rustdoc warnings are errors, the `cargo xtask` alias) is read
        # only from inside rust/.
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # The launcher tests that run an npm-style fake `claude` through `node` (launcher.rs,
      # hardening.rs, bundle.rs) must run here, not skip: the test step below requires node and
      # fails on a skip note, so removing this step fails the build. Nothing else needs Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The MSRV first, then stable, so stable ends up as the default toolchain.
      - uses: dtolnay/rust-toolchain@1.85

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Make stable the default explicitly; the MSRV check below names +1.85.
      - run: rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Unit, integration and golden tests, the black-box conformance tests (they run the built
      # jev-proxy-host and jev-statusline against fake Jev and Anthropic servers, and check the
      # case files in conformance/cases), and the xtask tests. The node-gated tests must run here,
      # not skip: JEV_REQUIRE_NODE=1 makes them fail instead of skipping, and the skip note they
      # print is also looked for in the output, so either way a missing node fails this step.
      - name: Unit, integration, golden and conformance tests
        env:
          JEV_REQUIRE_NODE: "1"
        run: |
          command -v node
          log="$RUNNER_TEMP/tests.log"
          cargo test --workspace --locked 2>&1 | tee "$log"
          # shellcheck disable=SC2016 # the backquotes are literal text in the note
          if grep -F 'skipped: `node` is not on PATH' "$log"; then
            echo "::error::node-gated tests skipped although setup-node put node on PATH"
            exit 1
          fi

      # The same node-gated tests with every folder holding node taken off PATH: users need no
      # Node.js, so `cargo test` must pass without it, each test must say it skipped, and the
      # no-node branch of prefers_claudes_cmd_shim_over_its_ps1 (an npm .cmd shim falls back to
      # cmd.exe, SPEC 10.2) runs nowhere else. 6 tests skip on Linux and 7 on Windows, where one
      # more is compiled in. macOS adds nothing the Linux leg does not cover.
      - name: Node-gated tests without node
        if: runner.os != 'macOS'
        run: |
          set -f
          clean=""
          IFS=: read -r -a dirs <<<"$PATH"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            if [ -e "$d/node" ] || [ -e "$d/node.exe" ]; then
              echo "taken off PATH: $d"
              continue
            fi
            clean="${clean:+$clean:}$d"
          done
          if PATH="$clean" command -v node; then
            echo "::error::node is still on PATH"
            exit 1
          fi
          if ! PATH="$clean" command -v cargo >/dev/null; then
            echo "::error::cargo shares a folder with node, so node cannot be taken off PATH alone"
            exit 1
          fi
          log="$RUNNER_TEMP/no-node.log"
          PATH="$clean" cargo test --locked --test launcher --test hardening --test bundle 2>&1 | tee "$log"
          # shellcheck disable=SC2016 # the backquotes are literal text in the note
          skipped="$(grep -o 'skipped: `node` is not on PATH' "$log" | wc -l | tr -d ' ')"
          # At least this many: the exact number moves whenever a launcher test is added, and what
          # matters is that the gated tests skip (not fail) and everything else still passes.
          want=6
          echo "$skipped node-gated tests skipped (at least $want expected)"
          if [ "$skipped" -lt "$want" ]; then
            echo "::error::expected at least $want node-gated tests to skip without node, $skipped did"
            exit 1
          fi

      - name: rustdoc
        run: cargo doc --workspace --no-deps --locked

      - name: MSRV (1.85) still builds
        run: cargo +1.85 check --workspace --all-targets --locked

      - name: Release build
        run: cargo build --release --locked

      # rust/.cargo/config.toml links the C runtime in (+crt-static) so the programs start without
      # the Visual C++ Redistributable. The runners have it installed, so nothing else would notice
      # a dynamic build (a RUSTFLAGS variable replaces the config file's flags).
      - name: The Windows programs link the C runtime statically
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./.github/scripts/assert-static-crt.ps1 -Dir rust/target/release

      # The seven programs of this build, for the installers job. A tar keeps the executable bits
      # that upload-artifact would drop, and fails here, not later, if a program is missing.
      - name: Collect the built programs
        working-directory: .
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          programs=()
          for name in jev-claude jev-statusline jev-explain jev-legend jev-check jev-update-check jev-proxy-host; do
            test -f "rust/target/release/$name$exe"
            programs+=("$name$exe")
          done
          tar -czf jev-built.tar.gz -C rust/target/release "${programs[@]}"

      # Three days, not one: "Re-run failed jobs" on an installers leg needs this artifact again.
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.os }}
          path: jev-built.tar.gz
          if-no-files-found: error
          retention-days: 3

  # Every published target, from this commit, the way the binaries job builds it after the tag:
  # built for its triple, checked for static linking, packaged and installed by the real installer
  # on a machine of its own architecture (.github/actions/release-target). Without this the musl,
  # arm64 and Intel-Mac builds would first compile after the release was tagged, where a failure
  # leaves a tag with no release.
  release-targets:
    name: release target (${{ matrix.target }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The same list as the binaries job's; change them together.
        include:
          - { target: windows-x64, os: windows-latest, triple: x86_64-pc-windows-msvc }
          - { target: linux-x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-musl }
          - { target: linux-arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-musl }
          - { target: macos-arm64, os: macos-latest, triple: aarch64-apple-darwin }
          # Intel hardware: the archive is installed and run natively (macos-13 is retired).
          - { target: macos-x64, os: macos-15-intel, triple: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-target
        with:
          target: ${{ matrix.target }}
          triple: ${{ matrix.triple }}

  # The installers on every platform they support, run against the programs the rust job just
  # built: `cargo xtask installer-smoke-test` packages them as the release archive, serves it from
  # a local server and runs the real install.sh (install.ps1 as well on Windows, under Windows
  # PowerShell 5.1 and PowerShell 7 where both are present) in a throwaway home. The installers
  # themselves need no toolchain and no Node.js; the Rust toolchain here only builds xtask. The
  # Linux leg installs the glibc-linked test build; the musl archives are installed by the
  # release-targets job and on Alpine by installer-alpine.
  # Windows 11 on ARM has no build of its own: it installs and runs the x64 programs through
  # emulation, so that leg takes the windows-latest build. It is experimental (it cannot block a
  # release) until it has passed reliably; its result is still shown on every run.
  installers:
    name: installer (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - { os: windows-11-arm, built: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/download-artifact@v4
        with:
          name: built-${{ matrix.built || matrix.os }}
          path: built

      - name: Unpack the built programs
        run: tar -xzf built/jev-built.tar.gz -C built

      - name: Installers install the built programs
        working-directory: rust
        run: cargo --locked xtask installer-smoke-test --bin-dir ../built

      # Claude Code on native Windows runs the skills' `!`<program> ; echo`` lines with its
      # PowerShell tool. Each line, under Windows PowerShell 5.1 and PowerShell 7: it exits 0 and
      # prints the program's output, and with the program missing it still exits 0 and says "not
      # recognized", which the skills tell the agent to look for. Whether jev-legend's non-ASCII
      # output survives each shell's re-encoding is reported as a notice, not checked.
      - name: The skills' command lines under PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/skill-lines.ps1 -Bin built

  # install.sh on Alpine, the one Linux the other legs cannot stand in for: musl libc (the
  # Platform row), BusyBox tar and sha256sum, BusyBox wget as the only downloader (curl absent),
  # and no git (the optional-git row). The programs are built natively in the container, which
  # gives the same static musl programs the release ships. No prerequisite is installed by the
  # installer here: with no terminal it only prints the apk commands.
  installer-alpine:
    name: installer (alpine, busybox wget)
    needs: lint
    runs-on: ubuntu-latest
    container: rust:1-alpine
    timeout-minutes: 30
    steps:
      # bash for install.sh and the workflow's steps, git only for the checkout, gcc and musl-dev
      # for ring's C, binutils for readelf. None of them brings curl, GNU tar or coreutils.
      - name: Packages
        shell: sh
        run: apk add --no-cache bash git gcc musl-dev binutils

      # No credentials are left behind, so the post-job cleanup needs no git (it is removed below).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # git goes once the sources are here, so install.sh takes its no-git path. The other
      # checks make sure the tools install.sh finds really are BusyBox's.
      - name: The Alpine install.sh is meant to see
        run: |
          apk del --no-cache git
          for tool in curl git; do
            if command -v "$tool"; then
              echo "::error::$tool is on PATH, so install.sh would not take its $tool-less path"
              exit 1
            fi
          done
          for tool in wget tar sha256sum; do
            path="$(readlink -f "$(command -v "$tool")")"
            echo "$tool: $path"
            if [ "$path" != /bin/busybox ]; then
              echo "::error::$tool is not BusyBox's"
              exit 1
            fi
          done
          ls /lib/ld-musl-*

      - name: Build the static musl programs
        working-directory: rust
        run: cargo build --release --locked

      - name: The programs are statically linked
        run: bash .github/scripts/assert-static-elf.sh rust/target/release

      - name: install.sh installs them on Alpine with BusyBox wget
        working-directory: rust
        run: cargo --locked xtask installer-smoke-test --bin-dir target/release

  # Bumps the version on every push to master, from the commits since the last release tag: minor
  # for a "feat:" commit, major for a breaking change, patch otherwise (`cargo xtask bump-version`).
  # It commits the new version to the root package.json and tags it, e.g. v0.5.0. Pull after
  # pushing to pick up that commit. Never runs unless every job above passed, on every platform.
  release:
    name: release
    needs: [lint, rust, release-targets, installers, installer-alpine]
    # The bump commit itself must not bump again. A push made with GITHUB_TOKEN does not start a
    # workflow anyway; this also covers a release commit pushed some other way.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      # Empty when this run does not release (a newer push is on master), which skips binaries
      # and publish.
      version: ${{ steps.bump.outputs.version }}
    # Two pushes in quick succession bump one after the other, never side by side.
    concurrency:
      group: version-bump
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release commit is made on top of this run's commit, so it can only be pushed while
      # that commit is still the head of master. If a newer push landed meanwhile, the run for that
      # push releases both: the bump counts every commit since the last tag.
      - id: fresh
        run: |
          git fetch --quiet origin master
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::master moved on after this run started; the run for the newer push releases these commits too"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.fresh.outputs.stale != 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.fresh.outputs.stale != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The assignment is its own command, so a failing xtask fails the step (inside echo's
      # argument it would not under bash -e) and an empty or odd version is rejected.
      - id: bump
        if: steps.fresh.outputs.stale != 'true'
        working-directory: rust
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          version="$(cargo --locked xtask bump-version "$BEFORE" "$AFTER")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --atomic: the commit and the tag land together or not at all, so a rejected push (master
      # moved after the check above) never leaves a tag on a commit that is not on master.
      - name: Commit and tag
        if: steps.fresh.outputs.stale != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:master "v$VERSION"

  # The native programs, built from the release commit for each platform, so the installers
  # (install.sh, install.ps1) need no toolchain and no Node.js on the user's machine. They must be
  # jobs of this run: a push made with GITHUB_TOKEN does not start another workflow. Linux builds
  # are static (musl), not glibc-linked, so they need no particular glibc and run on Alpine too;
  # Windows builds link the C runtime in. The steps are the release-targets job's (the same
  # .github/actions/release-target, the same matrix), so what is published is what was checked.
  binaries:
    name: binaries (${{ matrix.target }})
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The same list as the release-targets job's; change them together.
        include:
          - { target: windows-x64, os: windows-latest, triple: x86_64-pc-windows-msvc }
          - { target: linux-x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-musl }
          - { target: linux-arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-musl }
          - { target: macos-arm64, os: macos-latest, triple: aarch64-apple-darwin }
          # Intel hardware: the archive is installed and run natively (macos-13 is retired).
          - { target: macos-x64, os: macos-15-intel, triple: x86_64-apple-darwin }
    steps:
      # The tag, not github.sha: the version bump is a commit made after the push.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: ./.github/actions/release-target
        with:
          target: ${{ matrix.target }}
          triple: ${{ matrix.triple }}

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/jev-claude-*.tar.gz
          if-no-files-found: error

  # Publishes the GitHub release, with SHA256SUMS, only once every archive exists. The installers
  # download releases/latest/download/<archive>, so the names carry no version.
  publish:
    name: publish release
    needs: [release, binaries]
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum jev-claude-*.tar.gz | tee SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" dist/jev-claude-*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
