# Bumps the version on every push to master, from the commits pushed: minor for a "feat:" commit,
# major for a breaking change, patch otherwise (see scripts/bump-version.mjs). It commits the new
# version to package.json and tags it, e.g. v0.5.0. Pull after pushing to pick up that commit.
name: Version bump

on:
  push:
    branches: [master]

permissions:
  contents: write

# Two pushes in quick succession bump one after the other, never side by side.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    # The bump commit itself must not bump again. A push made with GITHUB_TOKEN does not start a
    # workflow anyway; this also covers a release commit pushed some other way.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pnpm version comes from "packageManager" in package.json, so CI reads the lockfile
      # with the same pnpm that wrote it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never release a version whose tests fail.
      - run: pnpm test

      - id: bump
        run: echo "version=$(node scripts/bump-version.mjs '${{ github.event.before }}' '${{ github.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:master "v${{ steps.bump.outputs.version }}"
