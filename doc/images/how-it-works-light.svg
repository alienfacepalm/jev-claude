<text x="234" y="332" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >the answer</text>
<text x="30" y="392" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >What happens on every prompt</text>
<circle cx="43" cy="421" r="13" fill="#0969da"/>
<text x="43" y="426" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="66" y="426" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start" >You type a prompt in Claude Code, exactly as you always do.</text>
<circle cx="43" cy="455" r="13" fill="#0969da"/>
<text x="43" y="460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="66" y="460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start" >jev-claude asks Jev which Claude model fits it: Haiku, Sonnet, Opus or Fable.</text>
<circle cx="43" cy="489" r="13" fill="#0969da"/>
<text x="43" y="494" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="66" y="494" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start" >It sends your request on to Anthropic on that model. Your sign-in or API key goes straight through; it is never read or stored.</text>
<circle cx="43" cy="523" r="13" fill="#0969da"/>
<text x="43" y="528" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="66" y="528" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start" >The answer comes straight back, and the status line shows which model ran.</text>
<rect x="30" y="590" width="900" height="44" rx="10" fill="#0d1117"/>
<text x="48" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >✧✦ Sonnet 5.5 (94%) · ◔ high · ≡ 8% · 5h ▰▰▱▱ 41% · ~/work/my-project</text>
<text x="30" y="576" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >The status line, at the bottom of Claude Code, shows the model each turn ran on:</text>
<text x="30" y="662" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >A model you pick yourself with /model skips Jev and goes straight through.</text>
<text x="30" y="682" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >If Jev cannot be reached, the turn stays on the model already in use: routing never blocks Claude Code.</text>
</svg>
