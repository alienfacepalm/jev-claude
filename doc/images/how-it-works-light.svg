<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 712" width="960" height="712" role="img" aria-labelledby="t d">
<title id="t">How jev-claude works</title>
<desc id="d">You type a prompt in Claude Code. jev-claude, a small proxy on your computer, asks Jev which Claude model fits the prompt (Haiku, Sonnet, Opus or Fable), then sends your request to Anthropic on that model. The answer comes straight back and the status line shows which model ran.</desc>
